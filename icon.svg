<svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Token usage heatmap">
  <!-- Drawn to match the other plugins in this profile: the same 36x36 rounded tile,
       the same vertical blue gradient, and white 1.6px line art with round joins. The
       glyph is this plugin's own subject — a contribution grid, nine days of it, two
       filled to read as the busy ones. -->
  <rect x="3" y="3" width="30" height="30" rx="8" fill="url(#a)" />
  <g stroke="#FFFFFF" stroke-width="1.6">
    <rect x="8.6" y="8.6" width="5.4" height="5.4" rx="1.4" />
    <rect x="15.3" y="8.6" width="5.4" height="5.4" rx="1.4" />
    <rect x="22" y="8.6" width="5.4" height="5.4" rx="1.4" />
    <rect x="8.6" y="15.3" width="5.4" height="5.4" rx="1.4" />
    <rect x="22" y="15.3" width="5.4" height="5.4" rx="1.4" />
    <rect x="8.6" y="22" width="5.4" height="5.4" rx="1.4" />
    <rect x="15.3" y="22" width="5.4" height="5.4" rx="1.4" />
  </g>
  <g fill="#FFFFFF">
    <rect x="15.3" y="15.3" width="5.4" height="5.4" rx="1.4" />
    <rect x="22" y="22" width="5.4" height="5.4" rx="1.4" />
  </g>
  <defs>
    <linearGradient id="a" x1="18" y1="3" x2="18" y2="33" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7AC2FF" />
      <stop offset="1" stop-color="#4A65E8" />
    </linearGradient>
  </defs>
</svg>
